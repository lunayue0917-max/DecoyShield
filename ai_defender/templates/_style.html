<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;color:#1f2933;background:#f4f6fa;line-height:1.5}
a{color:#2364d8;text-decoration:none}a:hover{text-decoration:underline}
code,pre{font-family:"JetBrains Mono","Consolas","Monaco",monospace;font-size:.9em}
pre{background:#0f172a;color:#e2e8f0;padding:14px 18px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#fff;border-bottom:1px solid #e1e5ee;box-shadow:0 1px 0 rgba(20,30,50,.02)}
.topbar .brand{font-weight:600;font-size:1.05rem}
.topbar .brand a{color:inherit}
.topbar nav a{margin-left:18px;color:#4a5568}

.hero{max-width:980px;margin:40px auto;padding:0 24px}
.hero h1{font-size:1.9rem;margin:0 0 8px}
.lead{color:#5a6577;margin-top:0}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:28px 0}
.card{background:#fff;border:1px solid #e1e5ee;border-radius:8px;padding:20px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{color:#5a6577;margin:0 0 14px;font-size:.92rem}
.btn{display:inline-block;padding:8px 14px;border-radius:6px;background:#eef2f8;color:#2364d8;border:1px solid #d8dfeb;font-size:.9rem;cursor:pointer}
.btn.primary{background:#2364d8;color:#fff;border-color:#2364d8}
.btn:hover{filter:brightness(.97)}
.footer{max-width:980px;margin:60px auto 30px;padding:0 24px;color:#8c95a8;font-size:.8rem}

.auth{max-width:420px;margin:60px auto;background:#fff;border:1px solid #e1e5ee;border-radius:8px;padding:28px}
.auth h2{margin:0 0 16px}
.auth label{display:block;font-size:.85rem;color:#4a5568;margin-top:14px}
.auth input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #cfd6e3;border-radius:4px;font-size:.95rem}
.auth button{margin-top:20px;width:100%}
.auth .hint{margin-top:20px;font-size:.85rem;color:#6b7280}
.error{background:#fff0f0;border:1px solid #ffcdcd;color:#a82424;padding:10px 12px;border-radius:4px;font-size:.88rem;margin-bottom:14px;word-break:break-word}
.dev-note{margin-top:22px;font-size:.85rem;color:#6b7280}
.dev-note summary{cursor:pointer}
.dev-note pre{background:#1e293b}

.api{max-width:900px;margin:30px auto;padding:0 24px}
.endpoint{background:#fff;border:1px solid #e1e5ee;border-radius:6px;padding:18px 22px;margin:18px 0}
.endpoint h3{margin:0 0 10px;font-size:1.02rem}
.m{display:inline-block;padding:2px 8px;border-radius:3px;font-size:.72rem;font-weight:700;margin-right:6px;color:#fff}
.m.get{background:#1a9b6e}.m.post{background:#1d63d6}.m.put{background:#c2710f}.m.delete{background:#c0392b}

body.defender{background:#0e1622;color:#d8dee9}
.defender-bar{background:#131c2c;border-bottom:1px solid #1d2839;color:#e3e9f3}
.defender-bar a{color:#7aa7ff}
.defender-bar .meta{color:#8997b1;font-size:.85rem}
.dash{max-width:1280px;margin:22px auto;padding:0 24px}
.dash h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;color:#94a3c4;margin:30px 0 12px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:22px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:rgba(24,33,50,.5);border:1px solid #1f2c44;border-radius:8px;padding:16px 18px}
.stat .num{font-size:1.8rem;font-weight:700;color:#f1f5fa;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.78rem;color:#8997b1;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;margin:2px 3px 2px 0;background:#2a3550;color:#cad4ec;border:1px solid transparent;font-family:"JetBrains Mono",monospace}
.pill.ml{background:rgba(217,90,90,.16);color:#ff8d8d;border-color:rgba(217,90,90,.35)}
.pill.tb{background:rgba(120,90,217,.18);color:#b59cff;border-color:rgba(120,90,217,.4)}
.pill.tr{background:rgba(90,180,130,.16);color:#82d8a8;border-color:rgba(90,180,130,.35)}
.verdict-row .verdict-bars{display:flex;flex-wrap:wrap;gap:10px}
.vb{background:rgba(24,33,50,.5);border:1px solid #1f2c44;padding:8px 14px;border-radius:6px;font-size:.85rem}
.vb-count{margin-left:8px;color:#f1f5fa;font-weight:600}
.v-likely_scanner{color:#ff7a7a;font-weight:600}
.v-likely_ai{color:#ffaa55;font-weight:600}
.v-likely_automation{color:#f7d774}
.v-likely_human{color:#82d8a8}
.v-unknown{color:#94a3c4}
table.events{width:100%;border-collapse:collapse;font-size:.85rem;background:#131c2c;border:1px solid #1f2c44;border-radius:8px;overflow:hidden}
.events thead{background:#1a253a}
.events th{text-align:left;padding:10px 12px;color:#94a3c4;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #25324b}
.events td{padding:9px 12px;border-bottom:1px solid #1a2438;vertical-align:top}
.events tr:last-child td{border-bottom:none}
.events .ts{color:#b3becf;font-variant-numeric:tabular-nums;font-family:monospace}
.events .ip{color:#e8eef9;font-family:monospace}
.events .path{color:#cad4ec;font-family:monospace;max-width:280px;overflow-wrap:break-word}
.events .score{font-family:monospace;color:#f1f5fa}
.tag{display:inline-block;background:#1c2740;color:#a8b4d0;padding:1px 6px;border-radius:3px;font-size:.7rem;margin:2px 3px 2px 0;font-family:monospace}
.empty{color:#8997b1;text-align:center;padding:30px;background:#131c2c;border:1px dashed #25324b;border-radius:8px}
</style>
