[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trap"
version = "0.2.1"
description = "Web-layer counter-recon honeypot against agentic LLM attackers — drops invisible-to-human, visible-to-LLM payloads into your Flask/HTTP responses to halt, stall, or fingerprint AI-driven penetration scans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "AI-Defender contributors" },
]
keywords = [
    "honeypot",
    "prompt-injection",
    "llm-security",
    "ai-security",
    "defense",
    "tarpit",
    "flask",
    "pentest",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Flask>=2.3",
    "MarkupSafe>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage    = "https://github.com/lunayue0917-max/AI-Defender"
Repository  = "https://github.com/lunayue0917-max/AI-Defender"
Issues      = "https://github.com/lunayue0917-max/AI-Defender/issues"
Changelog   = "https://github.com/lunayue0917-max/AI-Defender/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ai_defender*"]
exclude = ["tests*", "examples*", "logs*"]

[tool.setuptools.package-data]
ai_defender = ["templates/*.html", "templates/**/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
