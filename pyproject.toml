[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decoyshield"
version = "0.7.1"
description = "Counter-recon honeypot against agentic LLM attackers (PentestGPT / AutoGPT / LangChain agents). Five deploy modes: Flask drop-in, WSGI/ASGI middleware (Django/FastAPI/Starlette), callable primitives (inject_html/inject_json/@protect), `decoyshield` CLI, and edge configs for nginx/Caddy/Cloudflare Workers — no Python needed at the edge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "DecoyShield contributors" },
]
keywords = [
    "honeypot",
    "prompt-injection",
    "prompt-injection-defense",
    "llm-security",
    "ai-security",
    "agentic-ai",
    "defense",
    "tarpit",
    "pentest",
    "flask",
    "fastapi",
    "django",
    "starlette",
    "wsgi",
    "asgi",
    "middleware",
    "nginx",
    "caddy",
    "cloudflare-workers",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Flask>=2.3",
    "MarkupSafe>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "mypy>=1.0",
]

[project.scripts]
decoyshield = "decoyshield.cli.main:main"

[project.urls]
Homepage    = "https://github.com/lunayue0917-max/DecoyShield"
Repository  = "https://github.com/lunayue0917-max/DecoyShield"
Issues      = "https://github.com/lunayue0917-max/DecoyShield/issues"
Changelog   = "https://github.com/lunayue0917-max/DecoyShield/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["decoyshield*"]
exclude = ["tests*", "examples*", "logs*"]

[tool.setuptools.package-data]
decoyshield = ["templates/*.html", "templates/**/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
